[project]
name = "mas-trade"
version = "0.1.0"
description = "A multi-agent trading system for Binance perpetual futures: capital-staked hypothesis agents, decentralised ADMM, resilience and formal safety"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dashboard = [
    "plotly>=7.1.0",
    "streamlit>=1.67.0",
]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
